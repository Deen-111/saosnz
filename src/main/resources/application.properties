spring.profiles.active=prod

server.error.whitelabel.enabled=false
spring.devtools.restart.log-condition-evaluation-delta=false

##### COMMON DATABASE PROPERTIES#############
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


### LOGGING ###
logging.pattern.console=%d{HH:mm:ss} %clr(-%5p) - %clr(%-30.30class{0}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}
logging.pattern.file=%d{yyyy-MM-dd} -%5p -30.30class{0} - %msg%n
logging.file.name=${project.path}/Logs/saos.log
logging.logback.rollingpolicy.file-name-pattern=${project.path}/Logs/ztp-bharti-application-%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.clean-history-on-start=true
logging.logback.rollingpolicy.max-file-size=500KB
logging.logback.rollingpolicy.max-history=5

### EXCEPTION HANDLING ###
server.error.include-message: always
server.error.include-binding-errors: always
server.error.include-exception: false

### SESSION PROPERTIES ###
server.servlet.session.timeout=60m

### SPRING BOOT PROPERTIES #####
server.servlet.context-path=/saos

# MVC view properties
spring.mvc.view.prefix=/
spring.mvc.view.suffix=.jsp

### API URLS ###
post.check.api.url=${api.server.url}/post-check
pre.check.api.url=${api.server.url}/pre-check
installation.api.url=${api.server.url}/installation
download.api.url=${api.server.url}/download
execute.command.api.url=${api.server.url}/execute-command




